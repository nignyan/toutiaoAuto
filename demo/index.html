<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点内容自动化工作流 · 运营工作台 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="mark">HOT//FLOW</span>
      <span class="sub">热点内容自动化工作流 · 演示</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="demo-badge">DEMO · 模拟数据<br>交互均为真实状态流转<br>数据保存在浏览器本地</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">—</h1>
        <div class="hint" id="pageHint">—</div>
      </div>
      <div class="status">
        <button class="sim-btn" id="simBtn" title="暂停/继续自动化引擎"></button>
        <select id="simSpeed" class="sim-speed" title="引擎速度">
          <option value="1">1×</option>
          <option value="3">3×</option>
          <option value="6">6×</option>
        </select>
        <button class="chip-btn" id="logBtn">活动流 <b id="logCount">0</b></button>
        <button class="chip-btn danger" id="resetBtn" title="清空并恢复初始演示数据">重置数据</button>
      </div>
    </header>

    <div class="pipeline" id="pipeline"></div>
    <main class="stage" id="stage"></main>
  </div>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal-mask" id="modalMask"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="./data.js"></script>
<script src="./store.js"></script>
<script src="./engine.js"></script>
<script src="./views/radar.js"></script>
<script src="./views/topics.js"></script>
<script src="./views/assets.js"></script>
<script src="./views/production.js"></script>
<script src="./views/qc.js"></script>
<script src="./views/queue.js"></script>
<script src="./views/reflux.js"></script>
<script src="./views/accounts.js"></script>
<script src="./app.js"></script>
</body>
</html>
